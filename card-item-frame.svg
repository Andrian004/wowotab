<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Main Panel -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e34456c" />
      <stop offset="100%" stop-color="#0d18216e" />
    </linearGradient>
    
    <!-- Outer Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bf5eb" />
      <stop offset="100%" stop-color="#2a777d" />
    </linearGradient>

    <!-- Subtle Tech Grid to mimic the digital background -->
    <pattern id="techGrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#37687d" stroke-opacity="0.2" stroke-width="0.5"/>
    </pattern>

    <!-- Drop shadow for frame depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- BACKGROUND ACCENTS (GLOWING CYAN LAYERS) -->
  <!-- Top Right Accent -->
  <polygon points="190,15 295,15 295,145 280,130 280,30 190,30" fill="url(#cyanGrad)" opacity="0.8"/>
  <!-- Bottom Left Accent -->
  <polygon points="25,120 25,245 130,245 115,230 40,230 40,120" fill="url(#cyanGrad)" opacity="0.8"/>
  <!-- Top Left Accent -->
  <polygon points="25,65 25,15 75,15 60,30 40,30 40,65" fill="#1b4b54"/>
  <!-- Bottom Right Cut Accent -->
  <polygon points="180,245 295,145 295,175 195,255" fill="#1b4b54"/>

  <!-- MAIN DARK PANEL -->
  <g filter="url(#glow)">
    <polygon points="40,50 60,30 280,30 280,140 180,230 40,230" fill="url(#panelGrad)" stroke="#5ee2df" stroke-width="1.5"/>
    <!-- Grid Overlay -->
    <polygon points="40,50 60,30 280,30 280,140 180,230 40,230" fill="url(#techGrid)"/>
  </g>

  <!-- INNER TECH BORDER -->
  <polygon points="46,53 63,36 274,36 274,138 177,224 46,224" fill="none" stroke="#408d99" stroke-width="1.2" stroke-dasharray="5 3"/>

  <!-- CORNER UI DETAILS -->
  <!-- Top Right Bracket -->
  <path d="M 265 45 L 265 60 M 265 45 L 245 45" fill="none" stroke="#7bf5eb" stroke-width="2"/>
  <!-- Bottom Left Bracket -->
  <path d="M 52 212 L 52 197 M 52 212 L 72 212" fill="none" stroke="#7bf5eb" stroke-width="2"/>
  
  <!-- Edge indicators -->
  <circle cx="46" cy="100" r="1.5" fill="#7bf5eb"/>
  <circle cx="46" cy="110" r="1.5" fill="#7bf5eb"/>
  <circle cx="46" cy="120" r="1.5" fill="#7bf5eb"/>
  <circle cx="274" cy="70" r="1.5" fill="#7bf5eb"/>
  <circle cx="274" cy="80" r="1.5" fill="#7bf5eb"/>
</svg>
